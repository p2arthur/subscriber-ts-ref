name: Pull Request

on:
  pull_request:
    branches:
      - "**"

jobs:
  on_pull_request:
    name: Run On Pull Request Workflow
    uses: algorandfoundation/algokit-shared-config/.github/workflows/on-pull-request.yml@ref/consistency-ref-implementation
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
