name: On Release Merge

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  pages: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  on_merge_release:
    name: Run On Merge Release Workflow
    uses: p2arthur/algokit-shared-config-forked/.github/workflows/on-merge-release.yml@main
    with:
    secrets:
      BOT_ID: ${{ secrets.BOT_ID }}
      BOT_SK: ${{ secrets.BOT_SK }}
